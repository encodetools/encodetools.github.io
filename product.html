<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#eef1f5;
}

/* HEADER */
.header {
  background:#1a73e8;
  color:white;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

/* MAIN */
.container {
  max-width:1000px;
  margin:20px auto;
  background:white;
  border-radius:12px;
  padding:20px;
  display:flex;
  gap:30px;
  flex-wrap:wrap;
}

/* IMAGE */
.image-box {
  flex:1;
}

.image-box img {
  width:100%;
  border-radius:10px;
}

/* INFO */
.info {
  flex:1;
}

.title {
  font-size:24px;
  font-weight:bold;
}

.rating {
  color:#fbbc04;
  margin:8px 0;
}

.old-price {
  text-decoration:line-through;
  color:#999;
}

.price {
  color:#e53935;
  font-size:26px;
  font-weight:bold;
}

.badge {
  background:red;
  color:white;
  padding:5px 8px;
  border-radius:6px;
  font-size:12px;
  margin-left:10px;
}

/* BUTTON */
.btn {
  display:block;
  text-align:center;
  background:#28a745;
  color:white;
  padding:15px;
  border-radius:8px;
  text-decoration:none;
  margin-top:20px;
  font-size:18px;
  font-weight:bold;
}

/* DESCRIPTION */
.desc {
  margin-top:20px;
  color:#444;
}

.features {
  margin-top:10px;
}

.features li {
  margin-bottom:8px;
}

/* MOBILE */
@media (max-width:700px){
  .container {
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="header">🔥 Today Deals</div>

<div class="container" id="product"></div>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const p = products[id];

if (p) {
  document.getElementById("product").innerHTML = `
    
    <div class="image-box">
      <img src="${p.image}">
    </div>

    <div class="info">
      <div class="title">${p.name}</div>

      <div class="rating">★★★★★ (1,200 reviews)</div>

      <div>
        <span class="old-price">$199</span>
        <span class="price">${p.price}</span>
        <span class="badge">50% OFF</span>
      </div>

      <a href="${p.link}" class="btn">🛒 Shop Now</a>

      <div class="desc">
        <h3>Product Description</h3>
        <p>${p.desc}</p>

        <ul class="features">
          <li>✔ High quality material</li>
          <li>✔ Best seller product</li>
          <li>✔ Fast shipping available</li>
          <li>✔ Trusted by thousands</li>
        </ul>
      </div>

    </div>

  `;
} else {
  document.getElementById("product").innerHTML = "<h2>Product not found</h2>";
}
</script>

</body>
</html>
