<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Detail</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#f1f3f6;
}

/* HEADER */
.header {
  background:#131921;
  color:white;
  padding:15px 20px;
  font-size:20px;
  font-weight:bold;
}

/* MAIN */
.container {
  max-width:1100px;
  margin:20px auto;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

/* LEFT (IMAGE + DESC) */
.left {
  flex:2;
  background:white;
  padding:20px;
  border-radius:10px;
}

/* RIGHT (BUY BOX) */
.right {
  flex:1;
  background:white;
  padding:20px;
  border-radius:10px;
  height:fit-content;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

/* IMAGE */
.image {
  width:100%;
  border-radius:10px;
}

/* TITLE */
.title {
  font-size:22px;
  margin-top:10px;
}

/* RATING */
.rating {
  color:#ffb400;
  font-size:14px;
  margin:5px 0;
}

/* PRICE */
.old {
  text-decoration:line-through;
  color:#888;
}

.price {
  color:#e53935;
  font-size:24px;
  font-weight:bold;
}

/* BADGE */
.badge {
  background:#e53935;
  color:white;
  padding:4px 8px;
  border-radius:5px;
  font-size:12px;
  margin-left:10px;
}

/* BUTTON */
.btn {
  display:block;
  text-align:center;
  background:#ff9900;
  color:black;
  padding:12px;
  border-radius:8px;
  text-decoration:none;
  margin-top:15px;
  font-weight:bold;
}

/* FEATURES */
ul {
  margin-top:10px;
  padding-left:20px;
}

li {
  margin-bottom:8px;
}

/* EXTRA INFO */
.info-box {
  margin-top:10px;
  font-size:14px;
  color:#555;
}

/* MOBILE */
@media(max-width:800px){
  .container {
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="header">🔥 Today Deals</div>

<div class="container" id="product"></div>

<script src="./data.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if (typeof products === "undefined") {
  document.getElementById("product").innerHTML = "<h2>Data tidak ditemukan</h2>";
} else if (!products[id]) {
  document.getElementById("product").innerHTML = "<h2>Product tidak ditemukan</h2>";
} else {

  const p = products[id];

  let featuresHTML = "";
  if (p.features) {
    p.features.forEach(f => {
      featuresHTML += "<li>✔ " + f + "</li>";
    });
  }

  document.getElementById("product").innerHTML = `
    
    <div class="left">
      <img class="image" src="${p.image}">
      <div class="title">${p.name}</div>

      <div class="rating">
        ${p.rating || "★★★★☆"} (${p.reviews || "500"} reviews)
      </div>

      <div>
        <span class="old">${p.oldPrice || ""}</span>
        <span class="price">${p.price}</span>
        <span class="badge">${p.discount || "SALE"}</span>
      </div>

      <p>${p.desc}</p>

      <h3>Features</h3>
      <ul>${featuresHTML}</ul>
    </div>

    <div class="right">
      <div class="price">${p.price}</div>
      <div class="info-box">✔ Free shipping</div>
      <div class="info-box">✔ In stock</div>
      <div class="info-box">✔ Secure checkout</div>

      <a href="${p.link}" target="_blank" class="btn">🛒 Shop Now</a>
    </div>

  `;
}
</script>

</body>
</html>
