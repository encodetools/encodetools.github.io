<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 420px; padding: 15px; font-family: Arial, sans-serif; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
    select, input { 
      width: 100%; padding: 8px; box-sizing: border-box; 
      border: 1px solid #ddd; border-radius: 4px; font-size: 14px;
    }
    .custom-input { display: none; margin-top: 5px; }
    button { 
      padding: 10px; border: none; border-radius: 4px; cursor: pointer;
      font-size: 14px;
    }
    .save-btn { width: 100%; background: #0060df; color: white; margin-top: 10px; }
    .save-btn:hover { background: #003eaa; }
    .header-item { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
    .remove-btn { background: #ff4b4b; color: white; width: auto; padding: 6px 10px; }
    .add-btn { width: 100%; background: #4CAF50; color: white; margin-bottom: 10px; }
    .add-btn:hover { background: #45a049; }
    .sec-ch-group { background: #f5f5f5; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    .sec-ch-group h4 { margin-top: 0; color: #222; }
    .mode-toggle { 
      display: flex; gap: 10px; margin-bottom: 20px; 
      padding: 10px; background: #e3f2fd; border-radius: 6px;
    }
    .mode-btn { 
      flex: 1; padding: 8px; border: 1px solid #2196f3; 
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .mode-btn.active { background: #2196f3; color: white; }
    .section { display: none; }
    .section.active { display: block; }
  </style>
</head>
<body>
  <h3>Modifikasi HTTP Headers</h3>

  <!-- Toggle Mode Pilih / Manual -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="selectModeBtn">Mode Pilih (Mudah)</button>
    <button class="mode-btn" id="manualModeBtn">Mode Manual (Lengkap)</button>
  </div>


  <!-- ================== MODE PILIH (SELECT) ================== -->
  <div class="section active" id="selectModeSection">
    <div class="form-group">
      <label for="deviceType">Tipe Perangkat:</label>
      <select id="deviceType">
        <option value="android">Android</option>
        <option value="ios">iOS</option>
        <option value="macos">macOS</option>
        <option value="windows">Windows</option>
        <option value="lainnya">Tambah Tipe Sendiri</option>
      </select>
      <input type="text" id="customDeviceType" class="custom-input" placeholder="Contoh: Chrome OS">
    </div>

    <div class="form-group">
      <label for="chromeVersion">Versi Chrome:</label>
      <select id="chromeVersion">
        <option value="146.0.7680.153">146.0.7680.153</option>
        <option value="145.0.7632.120">145.0.7632.120</option>
        <option value="145.0.7632.109">145.0.7632.109</option>
        <option value="144.0.7353.134">144.0.7353.134</option>
        <option value="lainnya">Tambah Versi Sendiri</option>
      </select>
      <input type="text" id="customChromeVersion" class="custom-input" placeholder="Contoh: 147.0.7700.00">
    </div>

    <div class="form-group">
      <label for="deviceModel">Model Perangkat:</label>
      <select id="deviceModel">
        <option value="Infinix X693">Infinix X693</option>
        <option value="Samsung SM-G998B">Samsung Galaxy S21 Ultra</option>
        <option value="Apple iPhone 15">Apple iPhone 15</option>
        <option value="MacBook Pro 16-inch">MacBook Pro 16-inch</option>
        <option value="PC Desktop">PC Desktop</option>
        <option value="lainnya">Tambah Model Sendiri</option>
      </select>
      <input type="text" id="customDeviceModel" class="custom-input" placeholder="Contoh: Xiaomi Redmi Note 12">
    </div>

    <div class="form-group">
      <label for="platformVersion">Versi Platform:</label>
      <select id="platformVersion">
        <option value="11.0.0">Android 11</option>
        <option value="14.0.0">Android 14</option>
        <option value="17.0.0">iOS 17</option>
        <option value="15.0.0">macOS Sonoma</option>
        <option value="10.0.22621">Windows 11</option>
        <option value="lainnya">Tambah Versi Sendiri</option>
      </select>
      <input type="text" id="customPlatformVersion" class="custom-input" placeholder="Contoh: 12.0.0">
    </div>

    <div class="sec-ch-group">
      <h4>Preview Header yang Dibuat Otomatis</h4>
      
      <div class="form-group">
        <label>User-Agent (UA):</label>
        <input type="text" id="uaPreview" readonly placeholder="Preview akan muncul setelah memilih opsi">
      </div>

      <div class="form-group">
        <label>Sec-CH-UA:</label>
        <input type="text" id="secChUaPreview" readonly>
      </div>

      <div class="form-group">
        <label>Sec-CH-UA-Platform:</label>
        <input type="text" id="secChUaPlatformPreview" readonly>
      </div>

      <div class="form-group">
        <label>Sec-CH-UA-Mobile:</label>
        <input type="text" id="secChUaMobilePreview" readonly>
      </div>

      <div class="form-group">
        <label>Sec-CH-UA-Full-Version:</label>
        <input type="text" id="secChUaFullVersionPreview" readonly>
      </div>

      <div class="form-group">
        <label>Sec-CH-UA-Full-Version-List:</label>
        <input type="text" id="secChUaFullVersionListPreview" readonly>
      </div>

      <div class="form-group">
        <label>Sec-CH-UA-Platform-Version:</label>
        <input type="text" id="secChUaPlatformVersionPreview" readonly>
      </div>

      <div class="form-group">
        <label>Sec-CH-UA-Model:</label>
        <input type="text" id="secChUaModelPreview" readonly>
      </div>

      <div class="form-group">
        <label>Sec-CH-UA-Form-Factors:</label>
        <input type="text" id="secChUaFormFactorsPreview" readonly>
      </div>
    </div>
  </div>


  <!-- ================== MODE MANUAL (INPUT) ================== -->
  <div class="section" id="manualModeSection">
    <div class="form-group">
      <label for="manualUa">User-Agent (UA):</label>
      <input type="text" id="manualUa" placeholder="Contoh: Mozilla/5.0 (Linux; Android 11; Infinix X693) Chrome/146.0.7680.153 Mobile Safari/537.36">
    </div>

    <div class="sec-ch-group">
      <h4>Sec-CH-UA Headers Lengkap (Manual Input)</h4>
      
      <div class="form-group">
        <label for="manualSecChUa">Sec-CH-UA:</label>
        <input type="text" id="manualSecChUa" placeholder='"Chromium";v="146", "Not-A.Brand";v="24", "Google Chrome";v="146"'>
      </div>

      <div class="form-group">
        <label for="manualSecChUaPlatform">Sec-CH-UA-Platform:</label>
        <input type="text" id="manualSecChUaPlatform" placeholder='"Android"'>
      </div>

      <div class="form-group">
        <label for="manualSecChUaMobile">Sec-CH-UA-Mobile:</label>
        <input type="text" id="manualSecChUaMobile" placeholder="?1 atau ?0">
      </div>

      <div class="form-group">
        <label for="manualSecChUaFullVersion">Sec-CH-UA-Full-Version:</label>
        <input type="text" id="manualSecChUaFullVersion" placeholder='"146.0.7680.153"'>
      </div>

      <div class="form-group">
        <label for="manualSecChUaFullVersionList">Sec-CH-UA-Full-Version-List:</label>
        <input type="text" id="manualSecChUaFullVersionList" placeholder='"Chromium";v="146.0.7680.153", "Not-A.Brand";v="24.0.0.0", "Google Chrome";v="146.0.7680.153"'>
      </div>

      <div class="form-group">
        <label for="manualSecChUaPlatformVersion">Sec-CH-UA-Platform-Version:</label>
        <input type="text" id="manualSecChUaPlatformVersion" placeholder='"11.0.0"'>
      </div>

      <div class="form-group">
        <label for="manualSecChUaArch">Sec-CH-UA-Arch:</label>
        <input type="text" id="manualSecChUaArch" placeholder='"" atau "x86_64"'>
      </div>

      <div class="form-group">
        <label for="manualSecChUaBitness">Sec-CH-UA-Bitness:</label>
        <input type="text" id="manualSecChUaBitness" placeholder='"" atau "64"'>
      </div>

      <div class="form-group">
        <label for="manualSecChUaWoW64">Sec-CH-UA-WoW64:</label>
        <input type="text" id="manualSecChUaWoW64" placeholder="?0 atau ?1">
      </div>

      <div class="form-group">
        <label for="manualSecChUaModel">Sec-CH-UA-Model:</label>
        <input type="text" id="manualSecChUaModel" placeholder='"Infinix X693"'>
      </div>

      <div class="form-group">
        <label for="manualSecChUaFormFactors">Sec-CH-UA-Form-Factors:</label>
        <input type="text" id="manualSecChUaFormFactors" placeholder='"Mobile"'>
      </div>
    </div>
  </div>


  <!-- ================== HEADER TAMBAHAN (UNTUK SEMUA MODE) ================== -->
  <div class="form-group">
    <label>Header HTTP Tambahan (Opsional):</label>
    <div id="headerList">
      <div class="header-item">
        <input type="text" class="header-name" placeholder="Nama Header">
        <input type="text" class="header-value" placeholder="Nilai Header">
        <button class="remove-btn">Hapus</button>
      </div>
    </div>
    <button type="button" class="add-btn" id="add-header">Tambah Header Lain</button>
  </div>

  <button class="save-btn" id="saveBtn">Simpan & Terapkan</button>

  <script src="popup.js"></script>
</body>
</html>
